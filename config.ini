# ===========================================================================
# 实验报告记录工具 - 配置文件
# 修改后重启程序生效，或在设置对话框中修改后自动保存
# 缺失的配置项会使用代码中的默认值
# ===========================================================================

[Theme]
# 主色调（按钮、链接、选中态）
primaryColor=#4A90D9
# 成功色（已保存、已审核）
successColor=#67C23A
# 警告色（未保存、已提交）
warningColor=#E6A23C
# 危险色（错误、删除）
dangerColor=#F56C6C
# 字体族
fontFamily=Microsoft YaHei
# 基础字体大小（px）
baseFontSize=12

[Window]
# 主窗口默认宽度
mainWidth=1400
# 主窗口默认高度
mainHeight=900
# 是否记住窗口大小和位置
rememberWindowSize=true

[Editor]
# 编辑器默认字体族
fontFamily=Microsoft YaHei
# 编辑器默认字体大小（px）
fontSize=14
# 是否启用自动保存
autoSaveEnabled=true
# 自动保存间隔（毫秒，30000=30秒）
autoSaveInterval=30000
# 最大版本数
maxVersions=50

[UI]
# 状态栏消息显示时长（毫秒）
statusMessageDuration=3000
# 是否显示状态栏
showStatusBar=true

[Export]
# 默认导出格式（pdf/word/html/text）
defaultFormat=pdf
# 默认导出路径（留空使用用户主目录）
defaultPath=
